# LongBench v2 at 32k: lm-eval's longbench2 (503 questions, four-way choice by likelihood, the same subtasks and
# prompt) under a name that carries the context budget, so results at different lengths stay apart. The budget is
# the model's window: eval.py cuts longer contexts from the start (keeping the question) and refuses to run this
# group unless block_size is 32k plus at most a 4096-token margin.
group: longbench2_32k
task:
  - longbench2_history_tasks
  - longbench2_incontext_tasks
  - longbench2_multi_tasks
  - longbench2_single_tasks
  - longbench2_structured_tasks
  - longbench2_code
aggregate_metric_list:
  - metric: acc
    weight_by_size: True
metadata:
  version: 0.0
