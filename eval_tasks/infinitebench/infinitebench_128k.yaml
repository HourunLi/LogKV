# InfiniteBench's ten tasks at 128k tokens; score is their plain mean (the papers' Avg).
group: infinitebench_128k
task:
  - infinitebench_passkey_128k
  - infinitebench_number_string_128k
  - infinitebench_kv_retrieval_128k
  - infinitebench_longbook_sum_eng_128k
  - infinitebench_longbook_qa_eng_128k
  - infinitebench_longbook_choice_eng_128k
  - infinitebench_longbook_qa_chn_128k
  - infinitebench_longdialogue_qa_eng_128k
  - infinitebench_code_debug_128k
  - infinitebench_math_find_128k
aggregate_metric_list:
  - metric: score
    weight_by_size: false
metadata:
  version: 1.0
