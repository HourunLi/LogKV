# 多针 NIAH 公共配置：无 task 键，TaskManager 不单独注册，供同目录任务 include。
# 与 lm-eval RULER 的 niah_single_1.yaml 相同（去掉 longcxt tag），数据函数换成
# niah_multi.niah_multi，计分长度延伸到 1M。essay 草堆只有 40 个插入深度，针数不超过 40。
dataset_path: ""
dataset_name: ""
output_type: generate_until
test_split: test
custom_dataset: !function niah_multi.niah_multi
doc_to_text: "{{input}}"
doc_to_target: "{{outputs}}"
gen_prefix: "{{gen_prefix}}"
target_delimiter: " "
process_results: !function niah_multi.process_results
metric_list:
  - {metric: "1024", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "2048", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "4096", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "8192", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "16384", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "32768", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "65536", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "131072", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "262144", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "524288", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
  - {metric: "1048576", aggregation: !function niah_multi.aggregate_metrics, higher_is_better: true}
# 子任务改 max_gen_toks 时须同步 dataset_kwargs.tokens_to_generate（默认 128）。
generation_kwargs:
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
  until: []
repeats: 1
metadata:
  version: 1.0
