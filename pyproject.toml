[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=68.2.2",
  "wheel>=0.41.2",
]

[project]
name = "litgpt"
version = "0.5.12"
description = "Hackable implementation of state-of-the-art open-source LLMs"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
  { name = "Lightning AI", email = "contact@lightning.ai" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # download models:
  "huggingface-hub>=0.30,<1.4",
  "jsonargparse[signatures]>=4.37,<=4.41; python_version>='3.10'", # required to work with Python >=3.10
  "lightning>=2.6.1",
  "psutil==7.2.2",
  "safetensors>=0.4.3",
  # tokenization in most models:
  "tokenizers>=0.21",
  "torch>=2.7",
  # convert_hf_checkpoint
  "tqdm>4.66",
]
optional-dependencies.compiler = [
  # compilaton:
  "lightning-thunder>=0.2.dev20250119; python_version>='3.10' and sys_platform=='linux'",
]
optional-dependencies.extra = [
  "bitsandbytes>=0.42,<0.43; sys_platform=='darwin'",
  # quantization:
  "bitsandbytes>=0.45.2,<0.50; sys_platform=='linux' or sys_platform=='win32'",
  # litgpt.evaluate:
  "datasets>=2.18,<4",
  # download:
  "huggingface-hub[hf-transfer]>=0.21",
  "litdata==0.2.59",
  # litgpt logging:
  "litlogger>=0.1.7",
  # litgpt.deploy:
  "litserve>0.2",
  # lm-eval: pinned <0.4.9.1 due to trust_remote_code issues with datasets like logiqa.
  # See: https://github.com/EleutherAI/lm-evaluation-harness/issues/3171
  # Floor raised to 0.4.9: eval.py unconditionally passes metadata=... to
  # evaluator.simple_evaluate() (needed for RULER/NIAH's {"pretrained":...,
  # "max_seq_lengths":...} metadata), but simple_evaluate()/TaskManager.__init__()
  # only gained a `metadata` kwarg in lm-eval 0.4.9 (confirmed absent in the
  # 0.4.2/0.4.5/0.4.7/0.4.8 source) -- any version <0.4.9 in the old >=0.4.2
  # range raises TypeError on every eval.py call, not just NIAH ones. With the
  # <0.4.9.1 ceiling above, this pins to exactly 0.4.9.
  "lm-eval>=0.4.9,<0.4.9.1",
  # litgpt.data.prepare_starcoder.py:
  "pandas>=1.9",
  "pyarrow>=15.0.2",
  # litgpt.data:
  "requests>=2.31",
  # llama-based models:
  "sentencepiece>=0.2",
  # litgpt.pretrain:
  "tensorboard>=2.14",
  "torchmetrics>=1.3.1",
  "transformers>=4.51.3,<4.57",
  # litdata, only on non-Windows:
  "uvloop>=0.2; sys_platform!='win32'",
  # litgpt.data.prepare_slimpajama.py:
  "zstandard>=0.22",
]
optional-dependencies.test = [
  "einops>=0.7",
  "protobuf>=4.23.4",
  "pytest>=8.1.1",
  "pytest-benchmark>=5.1",
  "pytest-dependency>=0.6",
  "pytest-rerunfailures>=14",
  "pytest-timeout>=2.3.1",
]
urls.documentation = "https://github.com/lightning-AI/litgpt/tutorials"
urls.homepage = "https://github.com/lightning-AI/litgpt"
scripts.litgpt = "litgpt.__main__:main"

[tool.setuptools]
package-data.litgpt = [
  "LICENSE.md",
  "README.md",
]
packages.find.include = [
  "litgpt",
  "litgpt.*",
]
packages.find.exclude = []

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  "build",
  "dist",
  "docs",
]
lint.select = [
  "E",
  "F",  # see: https://pypi.org/project/pyflakes
  "I",  # implementation for isort
  "UP", # see: https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "W",  # see: https://pypi.org/project/pycodestyle
]
# extend-select = [
#    "C4",  # see: https://pypi.org/project/flake8-comprehensions
#    "PT",  # see: https://pypi.org/project/flake8-pytest-style
#    "RET",  # see: https://pypi.org/project/flake8-return
#    "SIM",  # see: https://pypi.org/project/flake8-simplify
# ]
lint.ignore = [
  "E501", # Line too long
  "E731", # Do not assign a lambda expression, use a def
  "E741", # todo: Ambiguous variable name
  "F841", # todo: Local variable is assigned to but never used
]
# Use Google-style docstrings.
lint.pydocstyle.convention = "google"

[tool.codespell]
# skip = '*.py'
quiet-level = 3
ignore-words-list = """
  tral, \
  Rockerfeller
"""

[tool.pytest]
ini_options.addopts = [
  "--strict-markers",
  # "--doctest-modules",
  "--color=yes",
  "--disable-pytest-warnings",
]
