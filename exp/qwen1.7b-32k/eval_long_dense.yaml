# 长文本评测（只评测、不重训）：原始 Qwen3-1.7B-Base，dense（全 KV，未经 CPT；不压缩的参照）。
# 一份配置测 32K / 64K / 128K / 256K（eval.sh 按长度逐档评测，见 long_eval_plan.py）。每档的窗口为长度 + 1024；
# YaRN 默认按长度取倍数（YARN_MODE=per_length：32K 不用，64K 2、128K 4、256K 8，原长 32768，与 Qwen 的 rope_scaling 相同），
# YARN_MODE=fixed 时每档都用最长一档的倍数（按该长度部署的模型），结果写到 <output_path>/yarn<F>/long<L>。
# 每档：NIAH 阶段跑 RULER（256K 为 12 个，不含 ruler_qa_squad），主阶段跑 BABILong、long_ppl_<L>（LONG_PPL_DATA）、
# long_ppl_books_<L>（LONG_PPL_BOOKS）、niah_turns_<L> 与 longbench2_<L>，每个任务 100 条。外部变量控制范围：
#   EVAL_LENGTHS=32k,128k            只测这些长度（默认 eval_lengths 全部）
#   EVAL_SUITES=ruler,babilong,ppl,books,turns,longbench2   只跑这些类（默认全部；默认时缺数据的 ppl / books 跳过）
#   NIAH_ONLY=1                      只跑 RULER
#   YARN_MODE=fixed                  固定倍数的附加实验
#   bash eval.sh exp/qwen1.7b-32k/eval_long_dense.yaml
config: dense_niah_base.yaml
eval_lengths: [32k, 64k, 128k, 256k]
limit: 100
long_ppl_data: ${LONG_PPL_DATA:-}
long_ppl_books: ${LONG_PPL_BOOKS:-}
