# SemanticLogKV 分支 · 32K Dense/SinkWindow/SemanticLogKV 三组对照实验
# ============================================================
# 已确认：SemanticLogKV 分支使用 arc_semantic_fast.yaml（用户 2026-09-23 确认）。
#
# 继承链：arc_semantic_fast.yaml -> arc_semantic_stage1_threephase.yaml ->
# base.yaml。三级链条里任何一级都没有覆盖 global_batch_size/micro_batch_size/
# max_steps，所以最终生效值就是 base.yaml 的 32 / 4 / 1500——严格满足 §六
# "三组同条件训练"的要求，不需要额外的公平性限定说明。
#
# arc_semantic_fast.yaml 自己覆盖的语义超参数（相对 threephase 的差异）：
#   - log_kv_second_order_scale: 0.0        （关掉二阶修正，纯一阶路径）
#   - log_kv_semantic_anchor_mode: mid       （单中心 anchor，不是 lo/mid/hi 三锚点）
#   - log_kv_B: 128                          （threephase 是 256）
#   - log_kv_cluster_k_max: 8                （继承自 threephase，未再覆盖）
#   - log_kv_semantic_centroid_backend: parallel
#   - log_kv_semantic_summary_size: 8        （摘要更新路径，不是逐 token 入 ladder）
#   - log_kv_semantic_replay_updates: true
#
# 这几个选择对本实验其余工具的影响，审计时已经处理：
#   - anchor_mode=mid 会用到 LogStructuredKVCache 的 mid-decode 瞬时 workspace
#     （_mid_decode_state）——litgpt/cache_accounting.py 的 structural/live_extra
#     两个数分开报正是为了这种情况；测试见
#     tests/test_cache_accounting.py::test_extra_live_tensors_reports_mid_decode_workspace_separately_from_structural。
#   - second_order_scale=0.0 意味着 level_sigma_*/level_gamma_* 这些二阶 buffer
#     根本不会分配（不是分配了却是零）；测试见
#     tests/test_cache_accounting.py::test_disabled_second_order_buffers_are_absent_not_zero_sized。
#
# 仓库里另外 4 份候选（k1/k16/chunktree_c256，以及 threephase 本身）不再需要
# 单独比较——留在这里只作审计记录：k1.yaml 名不副实（没设 cluster_k_max，实际
# 继承 base 的 16）；k16.yaml 完全不走 config: 继承，batch/steps
# （128/1/3000）和 base.yaml 的 32/4/1500 都不一样，如果误用会悄悄打破三组
# 同条件训练的前提。
config: arc_semantic_fast.yaml
