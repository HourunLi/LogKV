# 长文本评测（只评测、不重训）：LogKV P=1024，K/V 分数准入（同 checkpoint 的基线），评测长度 256k。
# 模型只训到 32K，RoPE 用 YaRN 拉长 8 倍（与 Qwen 的 rope_scaling 相同：factor、原长 32768，
# 注意力温度 0.1·ln(factor)+1；Qwen 官方只验证到 factor 4）；block_size 留出生成的余量。
# NIAH 阶段：RULER 的 12 个任务在 256k（不含 ruler_qa_squad：SQuAD dev 去重后 1204 段、约 22 万 token，lm-eval
# 会悄悄生成更短的样本）；主阶段：BABILong qa1-5（RMT-team/babilong，每个长度 100 条）与长文档困惑度
# （long_ppl_256k：不短于 262144 token 的另一批文档的最后 4096 个 token），每个任务 100 条。困惑度的数据由
# long_ppl_data 或环境变量 LONG_PPL_DATA 给出；PG19 测试集里够 256k 的书只有 4 本（按 Qwen 分词），书的曲线见下面的 long_ppl_books。
# LongBench v2（longbench2_256k，预算即 block_size）在主阶段；只补跑它：bash eval.sh <本文件> longbench2_256k none
# long_ppl_books_256k：同一批不短于 256K 的书（long_ppl_books 或 LONG_PPL_BOOKS，PG19 训练集：fetch_long_eval_data.py
# --ppl-books-hub emozilla/pg19）截到 8k…256k 各算末尾 4096 个 token 的困惑度；niah_turns_256k：niah_multiquery 的
# 四个键在同一份缓存上逐轮问（缓存时不知道问题）。
# infinitebench_256k：InfiniteBench 的十个任务（官方提示与评分）从中间截到 256k（数据 infinitebench_dir 或
# INFINITEBENCH_DIR，不设读 hub 缓存：fetch_long_eval_data.py --infinitebench）。
#   bash eval.sh exp/qwen1.7b-32k/eval_long256k_baseline.yaml
config: arc_gamma_k12_b128_p1024_2k.yaml
eval_max_seq_lengths: [262144]
niah_benchmark: [niah_single_1, niah_single_2, niah_single_3, niah_multikey_1, niah_multikey_2, niah_multikey_3,
  niah_multivalue, niah_multiquery, ruler_vt, ruler_cwe, ruler_fwe, ruler_qa_hotpot]
benchmark: babilong_256k,long_ppl_256k,long_ppl_books_256k,niah_turns_256k,longbench2_256k,infinitebench_256k
limit: 100
long_ppl_data: ${LONG_PPL_DATA:-}
long_ppl_books: ${LONG_PPL_BOOKS:-}
infinitebench_dir: ${INFINITEBENCH_DIR:-}
config_overrides:
  block_size: 263168
  rope_adjustments: {factor: 8.0, beta_fast: 32, beta_slow: 1, original_max_seq_len: 32768}
