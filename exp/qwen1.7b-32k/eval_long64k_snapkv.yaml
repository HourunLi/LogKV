# 长文本评测的同内存基线（只评测、不重训），评测长度 64k：SnapKV（逐块）：每块最后 64 个 query 的注意力经宽 5 的平均池化打分，留最近 64 个与得分最高的。
# 跑在原始 Qwen3-1.7B-Base 上（与 eval_long64k_dense.yaml 同一权重），任务、样本数、YaRN 与 block_size 同
