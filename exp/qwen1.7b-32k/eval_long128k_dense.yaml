# 长文本评测（只评测、不重训）：dense CPT（全 KV，上限），评测长度 128k。
# 模型只训到 32K，RoPE 用 YaRN 拉长 4 倍（与 Qwen 的 rope_scaling 相同：factor、原长 32768，
# 注意力温度 0.1·ln(factor)+1）；block_size 留出生成的余量。RULER 8 个任务与 BABILong qa1-5 在 128k，
# 每个任务 100 条。要加 LongBench v2：bash eval.sh <本文件> babilong_128k,longbench2
#   bash eval.sh exp/qwen1.7b-32k/eval_long128k_dense.yaml
config: cpt_dense.yaml
eval_max_seq_lengths: [131072]
niah_benchmark: [niah_single_1, niah_single_2, niah_single_3, niah_multikey_1, niah_multikey_2, niah_multikey_3, niah_multivalue, niah_multiquery]
benchmark: babilong_128k
limit: 100
config_overrides:
  block_size: 132096
  rope_adjustments: {factor: 4.0, beta_fast: 32, beta_slow: 1, original_max_seq_len: 32768}
