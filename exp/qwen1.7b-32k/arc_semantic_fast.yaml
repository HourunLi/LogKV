# 快路由 + 一阶 Flash SDPA 配置。显式关闭二阶修正，否则会继承基线的 0.2，
# `log_kv_slot_attention` 将继续走手写 score/softmax 路径。
config: arc_semantic_stage1_threephase.yaml

expid: qwen1.7b-32k-cpt-logKV-semantic-fast
save_path: /home/ma-user/work/bucket-wulan-green/lihourun/ckpt-logKV/qwen1.7b-32k-cpt-logKV-semantic-fast
merged_state_staging_dir: /home/ma-user/work/bucket-wulan-green/lihourun/ckpt-logKV/_fsdp_staging_semantic_fast
tensorboard_root: /home/ma-user/work/bucket-wulan-green/lihourun/tb-32k-semantic-fast

# 走旧路由（每 orphan 一次 Ward merge）只用于 A/B 对照，默认 false。
log_kv_semantic_legacy_route: null
log_kv_second_order_scale: 0.0
log_kv_B: 64
log_kv_cluster_k_max: 8
activation_checkpointing: true  # MLP 重算；attention 使用自身的流式 replay
entropy_chunk_size: 1024  # LM-head + CE 每次处理的 token 数，避免全序列 logits

# ── 尺寸档 ──
# 本机 CPU host 时间，塞进 8k token 后的稳态，每次调用（route + attn_state）：
