#   K=16 B=512 二阶0.2  167.6 + 342.1 = 509.7 ms   entries 77824   <- 当前基线
#   K=16 B=512 二阶0    103.2 + 128.2 = 231.3 ms   entries 77824
#   K=16 B= 64 二阶0     70.3 +  79.9 = 150.2 ms   entries 28416
#   K= 8 B= 64 二阶0     69.3 +  67.1 = 136.4 ms   entries 17984
#   K= 8 B= 32 二阶0     60.4 +  35.5 =  95.9 ms   entries 10816   <- 比基线省 5.3x
#
# 注意这是 host 时间；GPU 上 attn_state 里的 gather 会快很多，但 entries 数直接决定
# attention 矩阵宽度，方向是一致的。训练日志里的 `logKV_host:` 字段可以直接看到
# 这两项在你真实 step 里各占多少，按那个来调，别按这张表。
