# ==========================================
# 在已完成的 warmup CPT checkpoint（arc_warmup.yaml，1500 步）基础上，短续训
# importance_pooling，验证"模型没见过这个池化分布"是不是 niah 倒退的原因
# （对照 CLAUDE.md 6.5 结尾的判读逻辑）。
#
# 安全设计（读过来源代码后特意这样写，不要改这几点）：
#   1. save_path 用了一个新目录，不是 arc_warmup.yaml 的那个——续训绝不能写回
#      原始 checkpoint，否则 0.6113/0.1716/0.1918/0.0827 这组基线数字就再也复现
#      不出来了（那份 checkpoint 是所有对比表格的锚点）。
#   2. 用 resume_dir（只读原 checkpoint 的模型权重）而不是 auto_resume（会去读
#      save_path 下的完整训练状态）——因为 auto_resume 是"从 save_path 自己续"，
#      跟这里"从另一个目录的权重出发、存到新目录"的需求不匹配。代价：Adam 的
#      momentum/variance 从 0 重新累积，不是逐 bit 精确的"继续"，但对几百步的
#      短续训来说这是标准做法，不影响结论有效性。
#   3. global_step 从 0 开始计数（resume_dir 只读权重，不读 step 计数），所以
#      max_steps 直接就是"要续训多少步"，不需要再加上 1500。
#   4. second_order_warmup_steps 设成 0——加载进来的权重已经是在
#      second_order_scale=0.2 稳定收敛的状态，如果这里还从 0 重新 warmup 100 步，
#      等于先人为把模型拉回一阶模式再拉回来，会给这次实验的结果混入一个跟
#      importance_pooling 无关的干扰因素。
#
# 跑之前必须做的事：把下面 log_kv_importance_pooling_lambda /
# log_kv_importance_pooling_temperature 改成 eval-only 扫描里表现最好的那个值
# （只训一个配置，不要对着整个扫描网格都续训——续训比纯 eval 贵得多）。
# ==========================================

config: base.yaml

expid: qwen1.7b-32k-cpt-logKV-warmup-importance-continue

# 从原始 pretrained 权重出发的路径，仅在 resume_dir 缺失时才会被用到（正常情况
# 不会触发，因为下面 resume_dir 一定存在）。保留这一行只是为了让 base.yaml 的
# 校验/日志逻辑一致。
ckpt_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/checkpoints/Qwen/Qwen3-1.7B-Base/

# 关键：从已完成的 warmup checkpoint 读取初始权重（只读权重，见文件头说明）。
resume_dir: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/ckpt-new/qwen1.7b-32k-cpt-logKV-warmup

global_batch_size: 128
micro_batch_size: 1
# 续训步数，不是"目标 step"——resume_dir 只读权重，global_step 从 0 开始计数。
# 先设 300 试个信号，如果需要更充分收敛可以调大，但每调一次都是新一轮的 GPU 时间。
max_steps: 300
warmup_steps: 0
learning_rate: 5e-5
min_lr: 5e-5
weight_decay: 0.1
num_devices: 8

data_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/longcontext/prolong/data
num_workers: 16
save_ckpt: true
save_interval: 100
# 新目录，绝不能和 arc_warmup.yaml 的 save_path 相同（见文件头安全设计）。
save_path: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/ckpt-new/qwen1.7b-32k-cpt-logKV-warmup-importance-continue
merged_state_staging_dir: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/ckpt-new/_fsdp_staging_warmup_importance_continue

enable_tensorboard: true
tensorboard_root: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/tb-32k-warmup-importance-continue

log_kv_B: 512
log_kv_recent_size: 1024
log_kv_train_block: 16384
log_kv_prefill_block: 1024
log_kv_second_order_scale: 0.2
# 0，不是 100：加载进来的权重已经在目标 scale 收敛，不需要（也不应该）重新
# warmup，见文件头第 4 点。
log_kv_second_order_warmup_steps: 0
# pin 已终止（见 CLAUDE.md 6.4），保持关闭。
log_kv_pin_size: 0

log_kv_importance_pooling: true
# 2026-08-18：从 8.5 的 lambda/temperature 扫描里挑的候选——lambda=0.7 是全场
# 唯一在 LongBench(0.1733)/LongBench_e(0.1945)/niah(0.0833) 三项上都不输 vanilla
# 的点（0.6113/0.1716/0.1918/0.0827），temperature 留默认 1.0（不叠加，先验证
# 单旋钮续训是否有效）。若改选 niah 单项最优的候选（lambda=0.3 或
# temperature=0.7，niah 并列全场最高 0.0847），照抄这个字段的写法改数值即可。
log_kv_importance_pooling_lambda: 0.7
log_kv_importance_pooling_temperature: 1.0
