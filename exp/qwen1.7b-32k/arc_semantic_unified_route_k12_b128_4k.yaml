# Short unified-route CPT. This configuration currently starts from Base.
config: arc_semantic_fast.yaml
# For continuation from trained weights, set ckpt_dir to the actual checkpoint directory.
ckpt_dir: /home/ma-user/work/bucket-pangu-green/lihourun/checkpoints/Qwen/Qwen3-1.7B-Base/
resume_dir: null
# Only resume this new experiment's own optimizer/step if interrupted.
auto_resume: true

expid: qwen1.7b-32k-semantic-unified-route_k12_b128_4k
save_path: /home/ma-user/work/bucket-pangu-green/lihourun/ckpt-logKV/qwen1.7b-32k-semantic-unified-route_k12_b128_4k
merged_state_staging_dir: /home/ma-user/work/bucket-pangu-green/lihourun/ckpt-logKV/_fsdp_staging_semantic-unified-route_k12_b128_4k
