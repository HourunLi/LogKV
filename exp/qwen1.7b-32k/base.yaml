# Base config for Qwen3-1.7B 32K SemanticLogKV Stage 1.
arch_name: "Qwen/Qwen3-1.7B-Base"
context_length: 32768
expid: qwen1.7b-32k-cpt-logKV-semantic-stage1-k1

ckpt_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/checkpoints/Qwen/Qwen3-1.7B-Base/

global_batch_size: 128
micro_batch_size: 1
max_steps: 1500
learning_rate: 5e-5
weight_decay: 0.1
num_devices: 8
warmup_steps: 0
min_lr: 5e-5
entropy_chunk_size: 128

dataset_name: "prolong"
dataset_dir: "data"
data_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/longcontext/prolong/data
num_workers: 16
save_ckpt: true
save_interval: 200

enable_tensorboard: true
tensorboard_root: /home/ma-user/work/bucket-wulan-green/lihourun/tb-32k-semantic-stage1-k64
save_path: /home/ma-user/work/bucket-wulan-green/lihourun/ckpt-logKV/qwen1.7b-32k-cpt-logKV-semantic-stage1-k64
merged_state_staging_dir: /home/ma-user/work/bucket-wulan-green/lihourun/ckpt-logKV/_fsdp_staging_semantic_stage1_k64


log_kv_B: 1024
log_kv_recent_size: 4096
log_kv_train_block: 16384
log_kv_prefill_block: 1024
log_kv_second_order_scale: 0.2
log_kv_second_order_warmup_steps: 100
log_kv_pin_size: 0

log_kv_semantic_clusters: true
log_kv_cluster_k_max: 1
log_kv_cluster_lambda_rel: 1.0
log_kv_seg_eta: 1.0
log_kv_seg_g0: 2048.0
log_kv_seg_gap_max: null
log_kv_seg_block_level: 0
log_kv_seg_forget: 0.5
log_kv_semantic_s_h_path: null
log_kv_semantic_flush_granularity: 1024
log_kv_semantic_capacity_beta: 0.0
log_kv_semantic_capacity_hard_cap_mult: 0.0

# eval 覆盖：训练仍是 K_max=1（这份 base.yaml 上面那套值），eval 切到真实语义
# 聚类。majob.sh 里 K_max/B' 只通过乘积决定预算，两个必须一起给——见下面
# semantic budget 那道硬拦截。B=128 是 K=16 时验证过的安全值（S≈43008，约
# 1.31×N），不是随便抄训练的 B。
eval_log_kv_cluster_k_max: 16
eval_log_kv_B: 128
