# ==========================================
# SemanticLogKV Stage1 · Qwen3-1.7B · 32K 独立评测配置
# 仿照 kv 分支 exp/qwen1.7b-32k/eval.yaml（benchmark 列表逐项一致），
# 并补上 logKV 分支 eval.py 独有的参数。
#
# 用法（majob.sh 之外的手动评测；单机/多机 torchrun 均可）:
#   torchrun --nproc_per_node=8 eval.py --config exp/qwen1.7b-32k/eval.yaml
#
# 约定（与 demo.py 相同）:
#   - YAML 中非 null 的值覆盖命令行参数；
#   - 路径支持 ${VAR} / ${VAR-default} 环境变量展开；
#   - 可用 "config: <文件名>" 继承同目录下的另一份 YAML。
# ==========================================

# ── 评测对象 ──
# 默认指向 Stage1 K64 CPT 产物。
checkpoint_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/ckpt-new/qwen1.7b-32k-cpt-logKV
tokenizer_dir: &tokenizer_dir /home/ma-user/work/bucket-wulan-green/zhaoyusheng/checkpoints/Qwen/Qwen3-1.7B-Base/
# benchmark: "boolq,piqa,social_iqa,hellaswag,winogrande,arc_easy,arc_challenge,openbookqa,mmlu,ceval-valid,ifeval,truthfulqa_gen,truthfulqa_mc1,truthfulqa_mc2,longbench_2wikimqa,longbench_dureader,longbench_gov_report,longbench_hotpotqa,longbench_lcc,longbench_lsht,longbench_multi_news,longbench_multifieldqa_en,longbench_multifieldqa_zh,longbench_musique,longbench_narrativeqa,longbench_passage_count,longbench_passage_retrieval_en,longbench_qasper,longbench_qmsum,longbench_repobench-p,longbench_samsum,longbench_trec,longbench_triviaqa,longbench_vcsum,longbench_2wikimqa_e,longbench_gov_report_e,longbench_hotpotqa_e,longbench_lcc_e,longbench_multi_news_e,longbench_multifieldqa_en_e,longbench_passage_count_e,longbench_passage_retrieval_en_e,longbench_qasper_e,longbench_repobench-p_e,longbench_samsum_e,longbench_trec_e,longbench_triviaqa_e,niah_single_1,niah_single_2,niah_single_3"
benchmark: "niah_single_1,niah_single_2,niah_single_3"
output_path: /home/ma-user/work/bucket-wulan-green/lihourun/ckpt-logKV/qwen1.7b-32k-cpt-logKV-semantic-stage1-k64/evaluate
log_kv_B: 128
log_kv_recent_size: 1024
log_kv_second_order_scale: 0.2
log_kv_prefill_block: 128
log_kv_pin_size: 0
log_kv_semantic_clusters: true
log_kv_cluster_k_max: 64
log_kv_cluster_lambda_rel: 1.0
log_kv_seg_eta: 1.0
log_kv_seg_g0: 2048.0
log_kv_seg_gap_max: null
log_kv_seg_block_level: 0
log_kv_seg_forget: 0.5
log_kv_semantic_s_h_path: null
log_kv_semantic_flush_granularity: 1024
log_kv_semantic_capacity_beta: 0
log_kv_semantic_capacity_hard_cap_mult: 0


# eval 覆盖：训练仍是 K_max=1（这份 base.yaml 上面那套值），eval 切到真实语义
# 聚类。majob.sh 里 K_max/B' 只通过乘积决定预算，两个必须一起给——见下面
# semantic budget 那道硬拦截。B=128 是 K=16 时验证过的安全值（S≈43008，约
# 1.31×N），不是随便抄训练的 B。
eval_log_kv_cluster_k_max: 16
eval_log_kv_B: 128


# ── 其余可用键（保持 null / 注释即用默认或 CLI 值）──
# 覆盖模型 Config 字段（一般不需要：架构随 checkpoint 的 model_config.yaml
# 自动同步；仅评测缺 model_config.yaml 的旧 checkpoint 时用来对齐训练配置）：
# config_overrides:
#   n_layer: 28

# NIAH / RULER 任务需要 metadata（lm_eval 的 niah_* 自定义 dataset 靠它拿
# tokenizer 路径和测试长度，否则 get_tokenizer() 里 assert pretrained 报错）。
# benchmark 里只要还含 niah_*/ruler_*，这里就必须给，不能注释掉。
metadata:
  pretrained: *tokenizer_dir
  max_seq_lengths: [32768]
