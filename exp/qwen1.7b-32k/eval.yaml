# ==========================================
# logKV 分支 · Qwen3-1.7B · 32K 独立评测配置
# 仿照 kv 分支 exp/qwen1.7b-32k/eval.yaml（benchmark 列表逐项一致），
# 并补上 logKV 分支 eval.py 独有的参数。
#
# 用法（majob.sh 之外的手动评测；单机/多机 torchrun 均可）:
#   torchrun --nproc_per_node=8 eval.py --config exp/qwen1.7b-32k/eval.yaml
#
# 约定（与 demo.py 相同）:
#   - YAML 中非 null 的值覆盖命令行参数；
#   - 路径支持 ${VAR} / ${VAR-default} 环境变量展开；
#   - 可用 "config: <文件名>" 继承同目录下的另一份 YAML。
# ==========================================

# ── 评测对象 ──
# 默认指向 logKV 训练产物（base.yaml 的 save_path，目录内应有
# lit_model.pth + tokenizer 文件 + model_config.yaml）。
checkpoint_dir: ./ckpt/qwen1.7b-32k-debug
# 若要复现 kv 分支的「原始基座模型」基线评测，改用下面这行并把 use_log_kv 设为 false:
# checkpoint_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/checkpoints/Qwen/Qwen3-1.7B-Base/

# 仅当 checkpoint_dir 里没有 tokenizer.json / tokenizer.model 时才需要
# （旧 checkpoint、或训练时未拷贝 tokenizer 的目录）。正常留 null。
tokenizer_dir: null
# tokenizer_dir: checkpoints/Qwen/Qwen3-1.7B-Base

# ── benchmark（与 kv 分支 1.7b-32k eval.yaml 完全一致，一项不落）──
benchmark: "boolq,piqa,social_iqa,hellaswag,winogrande,arc_easy,arc_challenge,openbookqa,lambada_openai,wikitext,longbench_qasper,longbench_multifieldqa_zh,longbench_multifieldqa_en,longbench_triviaqa,longbench_trec,longbench_lsht,longbench_multi_news,longbench_qmsum,longbench_dureader,longbench_2wikimqa,longbench_gov_report_e,longbench_hotpotqa_e,longbench_multi_news_e,longbench_qasper_e,longbench_multifieldqa_en_e,longbench_passage_retrieval_en_e,longbench_samsum_e,longbench_trec_e,longbench_triviaqa_e,mmlu,ceval-valid,ifeval,truthfulqa_gen,truthfulqa_mc1,truthfulqa_mc2"

# ── 结果输出（目录；rank0 写带时间戳的 JSON + CSV）──
# 仿照 kv 的 ${MY_REAL_NAME-default} 写法，落在 checkpoint 目录下的 evaluate/。
output_path: ./ckpt/qwen1.7b-32k-debug/evaluate
# output_path: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/checkpoints/Qwen/Qwen3-1.7B-Base/

# ── logKV（本分支专属；评测须与训练时的注意力一致）──
# 评测 logKV 适配后的 checkpoint 时置 true；评测原始基座基线时置 false。
use_log_kv: true
# 必须与训练 YAML（base.yaml）中的取值一致：
log_kv_B: 512
log_kv_recent_size: 1024

# ── 其余可用键（保持 null / 注释即用默认或 CLI 值）──
# 覆盖模型 Config 字段（一般不需要，model_config.yaml 已随 checkpoint 保存）：
# config_overrides:
#   rotary_percentage: 0.25

# NIAH / RULER 任务需要 metadata（majob.sh 里由第二个 torchrun 单独传入；
# 手动跑 niah_* 时取消注释）：
# metadata:
#   pretrained: ./ckpt/qwen1.7b-32k-debug
#   max_seq_lengths: [1024, 2048, 4096, 8192, 16384, 32768]
