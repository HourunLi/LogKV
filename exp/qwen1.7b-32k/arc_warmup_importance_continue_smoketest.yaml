# ==========================================
# arc_warmup_importance_continue.yaml 的冒烟测试版——只用来验证"续训
# importance_pooling"这条流程能不能跑通（resume_dir 权重加载、
# checkpoint_meta.yaml 写入、eval 阶段是否正确带上 importance_pooling 参数），
# 不用来产出真实实验信号。跑完看流程有没有报错、checkpoint 有没有正常落盘、
# eval 阶段的 JSON 里 log_kv_importance_pooling* 字段是不是预期值即可，数字
# 本身不用当真（max_steps 太小，不代表任何收敛结果）。
#
# 跟正式版 arc_warmup_importance_continue.yaml 的差异只有三处：
#   1. save_path/merged_state_staging_dir/tensorboard_root 全部换成独立的
#      "-smoketest" 后缀目录——绝不能跟正式续训共用 save_path，否则冒烟测试
#      跑出的（未收敛的）checkpoint_meta.yaml 会让 majob.sh 把正式续训误判成
#      "已完成"直接跳过训练（见 CLAUDE.md 第 7 节的 checkpoint_finished 踩坑）。
#   2. max_steps 从 300 降到 6、save_interval 从 100 降到 3——6 步里能走到
#      一次 interval save（step 3）和一次 final save（step 6），两条保存代码
#      路径都能被冒烟测试覆盖到，但不需要真的等一次完整续训跑完。
#   3. lambda/temperature 从占位的 1.0/1.0 改成 0.5/0.5——只是为了让流程里
#      真正走到 lambda<1/temperature<1 的插值分支（1.0/1.0 会退化成逐字节等价
#      于关闭 lambda/temperature 的旧代码路径，测不到这两个新分支），具体数值
#      不重要，冒烟测试不关心收敛质量。
#
# resume_dir 指向的仍然是正式的 arc_warmup 1500 步 checkpoint（只读，不会被
# 这次冒烟测试写坏），其它安全设计（resume_dir 而非 auto_resume、
# second_order_warmup_steps=0）跟正式版一致，见 arc_warmup_importance_continue.yaml
# 文件头注释。
# ==========================================

config: base.yaml

expid: qwen1.7b-32k-cpt-logKV-warmup-importance-continue-smoketest

ckpt_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/checkpoints/Qwen/Qwen3-1.7B-Base/

resume_dir: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/ckpt-new/qwen1.7b-32k-cpt-logKV-warmup

global_batch_size: 128
micro_batch_size: 1
# 冒烟测试专用：只需要走完 loop + 至少一次 interval save + final save。
max_steps: 6
warmup_steps: 0
learning_rate: 5e-5
min_lr: 5e-5
weight_decay: 0.1
num_devices: 8

data_dir: /home/ma-user/work/bucket-wulan-green/zhaoyusheng/longcontext/prolong/data
num_workers: 16
save_ckpt: true
save_interval: 3
# 独立目录，不与 arc_warmup_importance_continue.yaml 或 arc_warmup.yaml 共用。
save_path: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/ckpt-new/qwen1.7b-32k-cpt-logKV-warmup-importance-continue-smoketest
merged_state_staging_dir: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/ckpt-new/_fsdp_staging_warmup_importance_continue_smoketest

enable_tensorboard: true
tensorboard_root: /home/ma-user/work/bucket-wulan-green/${MY_REAL_NAME-default}/tb-32k-warmup-importance-continue-smoketest

log_kv_B: 512
log_kv_recent_size: 1024
log_kv_train_block: 16384
log_kv_prefill_block: 1024
log_kv_second_order_scale: 0.2
log_kv_second_order_warmup_steps: 0
log_kv_pin_size: 0

log_kv_importance_pooling: true
log_kv_importance_pooling_lambda: 0.5
log_kv_importance_pooling_temperature: 0.5
