# Gamma cue + 字面量：精确池选片段时，cue 价值之外再给含随机字面量首次出现的片段加分。
# 算法开关沿用 arc_semantic_fast.yaml；与 arc_gamma_cue_k12_b128_2k 只差 log_kv_gamma_literals，
# 训练超参相同，便于直接对照。
config: arc_semantic_fast.yaml
ckpt_dir: /home/ma-user/work/bucket-pangu-green/lihourun/checkpoints/Qwen/Qwen3-1.7B-Base/
resume_dir: null
# Only resume this new experiment's own optimizer/step if interrupted.
auto_resume: true

expid: qwen1.7b-32k-gamma_cue_literal_k12_b128_2k
save_path: /home/ma-user/work/bucket-pangu-green/lihourun/ckpt-logKV/qwen1.7b-32k-gamma_cue_literal_k12_b128_2k
merged_state_staging_dir: /home/ma-user/work/bucket-pangu-green/lihourun/ckpt-logKV/_fsdp_staging-gamma_cue_literal_k12_b128_2k
tensorboard_root: /home/ma-user/work/bucket-pangu-green/lihourun/tb/tb-32k-gamma_cue_literal_k12_b128_2k

max_steps: 1200
learning_rate: 5e-6
min_lr: 3e-6
warmup_steps: 100
save_interval: 400
run_eval: ""

log_kv_cluster_k_max: 12
log_kv_recent_size: 2048
log_kv_B: 128  # 原始字节预算；32K 时实际 B′=125、7 层（精确池 256 从中扣除）
log_kv_gamma_literals: true
