# Eval-only config: run eval.py directly with this config
checkpoint_dir: ./ckpt/qwen0.6b-32k-cpt-base

benchmark: "boolq,piqa,social_iqa,hellaswag,winogrande,arc_easy,arc_challenge,openbookqa"

output_path: ./ckpt/qwen0.6b-32k-cpt-base/evaluate

# The checkpoint was adapted with logKV (cpt-base.yaml), and this pipeline only
# evaluates the compressed-KV route. B/recent_size/second_order_scale must
# match training.
log_kv_B: 512
log_kv_recent_size: 1024
log_kv_second_order_scale: 1.0
