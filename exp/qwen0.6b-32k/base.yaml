# ==========================================
# Base config for Qwen3-0.6B with 32K context (logKV branch)
# ==========================================
arch_name: "Qwen/Qwen3-0.6B-Base"
context_length: 32768

# Training hyperparams
global_batch_size: 128
micro_batch_size: 4
max_steps: 300
learning_rate: 2e-5
weight_decay: 0.1
num_devices: 1
warmup_steps: 5
min_lr: 2e-6
entropy_chunk_size: 128

# Data & IO
dataset_name: "debug"
dataset_dir: "data"
data_dir: "data"
num_workers: 16
save_ckpt: false
save_path: "./ckpt/qwen0.6b-32k-debug"

# TensorBoard
enable_tensorboard: true
tensorboard_root: "./tb"

# Log-structured KV cache (uniform 2:1 compaction)
# Buffer:      recent_size raw tokens, no compression
# Level 0:     B entries, each = 2 tokens merged
# Level 1+:    B entries, each = 2 entries from prev level merged
log_kv_B: 512
log_kv_recent_size: 1024
