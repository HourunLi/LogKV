# CPT with standard attention + log-structured KV cache
config: base.yaml

expid: cpt-base

ckpt_dir: checkpoints/Qwen/Qwen3-0.6B-Base

global_batch_size: 128
micro_batch_size: 1
max_steps: 2000
warmup_steps: 10
learning_rate: 5e-5
min_lr: 5e-6
weight_decay: 0.1
num_devices: 8

data_mix_yaml: ./exp/data_config/base-qwen.yaml
num_workers: 16
save_ckpt: true
save_path: ./ckpt/qwen0.6b-32k-cpt-base

enable_tensorboard: true
tensorboard_root: ./tb-32k

# Log-structured KV cache (always on: demo.py simulates compressed-KV
# attention for the whole run; eval uses the same B/recent_size). Run AFTER
# dense pretraining so the model learns to read compressed KV.
log_kv_B: 512
log_kv_recent_size: 1024
log_kv_second_order_scale: 1.0
log_kv_second_order_warmup_steps: 10

# 显著性钉扎（SnapKV 式观察窗；仅评测推理用，训练不受影响，随 run_eval/majob
# 转发给 eval.py）。捞针类任务的关键：prefill 时 prompt 末尾 obs_window 个
# query 给全前缀打分，每组钉 pin_size 个 token 为精确槽。0 = 关闭。
log_kv_pin_size: 256
log_kv_pin_obs_window: 64
