# 长文本评测（只评测、不重训）：原始 Qwen3-8B-Base，dense（全 KV，未经 CPT；不压缩的参照）。
# 逐档评测 32K / 64K / 128K / 256K；每档窗口为长度 + 1024，YaRN 按长度取倍数。
# 每个任务 100 条；模型与缓存参数继承本目录的配置。LongBench v2 必跑，缺数据时报错。
#   bash eval.sh exp/qwen8b-32k/eval_long_dense.yaml
config: dense_niah_base.yaml
eval_lengths: [32k, 64k, 128k, 256k]
limit: 100
long_ppl_data: ${LONG_PPL_DATA:-}
long_ppl_books: ${LONG_PPL_BOOKS:-}
infinitebench_dir: ${INFINITEBENCH_DIR:-}
