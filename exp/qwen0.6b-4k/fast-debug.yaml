# ==========================================
# 极速 Debug 模式 (用于验证代码逻辑和显存水位)
# ==========================================
config: base.yaml

# 训练超参
global_batch_size: 4       # 极小的全局 Batch，快速凑够一次梯度更新
micro_batch_size: 1        # 单卡每次只塞 1 条序列，探测显存底线
max_steps: 5               # 只跑 5 步！如果代码有 Bug，5 步之内必炸

# 数据与 IO
dataset_name: "debug"
dataset_dir: "data"
num_workers: 0
save_ckpt: false           # Debug 阶段绝对不保存权重，省时间
